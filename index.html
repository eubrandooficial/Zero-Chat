<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZeroChat</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--panel2:#182229;--chat:#0b141a;--in:#202c33;--out:#005c4b;--acc:#00a884;--txt:#e9edef;--mut:#8696a0;--bdr:#2a3942;--danger:#ef4444}
[data-theme="light"]{--bg:#f0f2f5;--panel:#ffffff;--panel2:#f8f9fa;--chat:#efeae2;--in:#ffffff;--out:#d9fdd3;--acc:#00a884;--txt:#111b21;--mut:#667781;--bdr:#e2e8f0}
[data-theme="oled"]{--bg:#000000;--panel:#0a0a0a;--panel2:#050505;--chat:#000000;--in:#121212;--out:#004236;--acc:#00d9a6;--txt:#ffffff;--mut:#71717a;--bdr:#1f1f23}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);height:100dvh;overflow:hidden;display:flex;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
.hide{display:none!important}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);transition:.15s}
.icon-btn:hover{background:rgba(128,128,128,.15);color:var(--txt)}
.btn{background:var(--acc);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:var(--panel2);border:1px solid var(--bdr);color:var(--txt)}.btn.red{background:var(--danger)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--bdr);border-radius:8px;padding:9px 12px;color:var(--txt)}
.inp:focus{border-color:var(--acc)}

/* Auth */
#authView{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--bdr);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.auth-head{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--acc)}
.tabs{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:3px}
.tab{flex:1;padding:7px;border-radius:6px;font-weight:600;color:var(--mut);text-align:center}
.tab.active{background:var(--acc);color:#fff}

/* Layout */
#app{display:flex;width:100%;height:100dvh;position:relative}
aside{width:360px;max-width:100%;background:var(--bg);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.top-bar{height:58px;background:var(--panel);padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);gap:8px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.search-box{padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bdr);display:flex;gap:8px;align-items:center}
.search-wrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 12px;border-radius:8px}
.nav-pills{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--bdr);overflow-x:auto}
.pill{padding:5px 11px;border-radius:16px;background:var(--panel);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap}
.pill.active{background:var(--acc);color:#fff}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(128,128,128,.08);cursor:pointer;transition:.12s}
.chat-item:hover,.chat-item.active{background:var(--panel)}
.ci-mid{flex:1;min-width:0}.ci-top{display:flex;justify-content:space-between;margin-bottom:3px}.ci-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;background:var(--acc);color:#fff;padding:1px 6px;border-radius:10px}

/* Main chat */
main{flex:1;display:flex;flex-direction:column;background:var(--chat);position:relative;min-width:0}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);text-align:center;padding:24px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(128,128,128,.08) 1px,transparent 1px);background-size:20px 20px}
.msg{max-width:74%;padding:7px 10px 5px;border-radius:10px;position:relative;word-break:break-word;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 1px rgba(0,0,0,.18)}
.msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
.msg.out{align-self:flex-end;background:var(--out);border-top-right-radius:2px}
.msg-sender{font-size:11px;font-weight:700;color:var(--acc)}
.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--mut);margin-top:2px}
.msg img.media{max-width:220px;max-height:220px;border-radius:8px;object-fit:contain}
.msg.sticker{background:transparent!important;box-shadow:none;padding:2px}
.msg.sticker img{width:130px;height:130px;object-fit:contain}
.pack-card{background:var(--panel2);border:1px solid var(--bdr);border-radius:10px;padding:10px;min-width:210px;display:flex;flex-direction:column;gap:6px}
.pack-thumbs{display:flex;gap:4px;overflow-x:auto}.pack-thumbs img{width:44px;height:44px;object-fit:contain;background:rgba(0,0,0,.15);border-radius:6px}
.composer{background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--bdr)}
.composer input{flex:1;background:var(--panel2);border-radius:20px;padding:9px 14px;border:1px solid var(--bdr)}

/* Drawer: Emoji / GIF / Stickers */
.drawer{height:310px;background:var(--panel);border-top:1px solid var(--bdr);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--bdr);gap:8px}
.drawer-cats{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--bdr);overflow-x:auto}
.drawer-body{flex:1;overflow-y:auto;padding:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px}
.emoji-btn{height:34px;font-size:20px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.emoji-btn:hover{background:rgba(128,128,128,.18)}
.gif-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gif-item{height:95px;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel2)}
.gif-item img{width:100%;height:100%;object-fit:cover}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.stk-item{background:var(--panel2);border:1px solid var(--bdr);border-radius:8px;padding:5px;position:relative;display:flex;align-items:center;justify-content:center;height:74px;cursor:pointer}
.stk-item img{max-width:100%;max-height:100%;object-fit:contain}
.stk-fav{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fbbf24;display:flex;align-items:center;justify-content:center}

/* Modals & Profile Banner */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:440px;max-height:88dvh;background:var(--panel);border:1px solid var(--bdr);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;font-weight:700}
.modal-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.banner-box{position:relative;margin-bottom:32px}
.banner-img{width:100%;height:110px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--acc),#1e293b);display:block}
.banner-av{position:absolute;left:14px;bottom:-28px;width:68px;height:68px;border:4px solid var(--panel);border-radius:50%;background:var(--panel2);overflow:hidden}
.banner-av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.1)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px;display:block}

/* Context menu & Call */
.ctx{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--bdr);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:165px}
.ctx button{width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px}
.ctx button:hover{background:rgba(128,128,128,.15)}
#callModal{position:fixed;inset:0;background:rgba(5,10,14,.95);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 16px;color:#fff}
.call-videos{position:relative;width:100%;max-width:680px;flex:1;display:flex;align-items:center;justify-content:center;margin:14px 0;background:#0f172a;border-radius:16px;overflow:hidden}
#remoteVid{width:100%;height:100%;object-fit:cover}
#localVid{position:absolute;right:12px;bottom:12px;width:120px;height:160px;object-fit:cover;border-radius:10px;border:2px solid var(--acc);background:#000}
.blurred{filter:blur(16px)}
.call-ctrls{display:flex;gap:16px}
.cbtn{width:52px;height:52px;border-radius:50%;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:center}
.cbtn.on{background:var(--acc)}.cbtn.end{background:var(--danger)}

#backBtn{display:none}
@media(max-width:768px){
  aside{width:100%}
  #app.chat-open aside{display:none}
  #app:not(.chat-open) main{display:none}
  #backBtn{display:inline-flex}
}
</style>
</head>
<body data-theme="dark">

<!-- AUTH -->
<div id="authView">
  <div class="auth-card">
    <div class="auth-head"><span id="authLogo"></span>ZeroChat</div>
    <div class="tabs">
      <button class="tab active" data-auth="login">Entrar</button>
      <button class="tab" data-auth="reg">Criar Conta</button>
    </div>
    <div>
      <label class="lbl">Username fixo (Nick)</label>
      <input id="aUser" class="inp" placeholder="ex: zero_user" autocomplete="username">
    </div>
    <div>
      <label class="lbl">Palavra-passe</label>
      <input id="aPass" type="password" class="inp" placeholder="Sua senha" autocomplete="current-password">
    </div>
    <div id="aMsg" style="font-size:12px;color:var(--danger)"></div>
    <button id="aSubmit" class="btn">Entrar no ZeroChat</button>
    <div style="font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px">
      <span id="authLock"></span> Criptografia E2EE + Cifra Toki Pona no RTDB
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <aside>
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer" id="btnMyProfile">
        <div class="av" id="myAv"></div>
        <div><div id="myNick" style="font-weight:700"></div><div style="font-size:11px;color:var(--acc)">Online</div></div>
      </div>
      <div style="display:flex;gap:2px">
        <button class="icon-btn" id="btnNewChat" title="Novo Contato / Grupo / Canal"></button>
        <button class="icon-btn" id="btnThemeQuick" title="Alternar Tema"></button>
        <button class="icon-btn" id="btnSettings" title="Configurações e Privacidade"></button>
      </div>
    </div>
    <div class="search-box">
      <div class="search-wrap"><span id="icSearch"></span><input id="searchInp" placeholder="Buscar conversa ou canal..."></div>
    </div>
    <div class="nav-pills" id="navPills">
      <button class="pill active" data-f="all">Tudo</button>
      <button class="pill" data-f="dm">Contatos (<span id="cntDm">0</span>/45)</button>
      <button class="pill" data-f="group">Grupos (<span id="cntGrp">0</span>/7)</button>
      <button class="pill" data-f="channel">Canais (<span id="cntCh">0</span>/3)</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main>
    <div id="emptyMain" class="empty-state">
      <div id="emptyLogo" style="color:var(--acc)"></div>
      <h2>ZeroChat Web</h2>
      <p style="max-width:320px;font-size:13px">Mensagens protegidas com criptografia de ponta a ponta (ECDH + AES-GCM) e codificadas em Toki Pona no banco.</p>
    </div>
    <div id="chatArea" class="hide" style="display:flex;flex-direction:column;height:100%">
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button class="icon-btn" id="backBtn"></button>
          <div class="av" id="peerAv" style="cursor:pointer"></div>
          <div style="min-width:0;cursor:pointer" id="peerInfoBtn">
            <div id="peerName" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
            <div id="peerSub" style="font-size:11px;color:var(--mut)"></div>
          </div>
        </div>
        <div style="display:flex;gap:2px;align-items:center">
          <button class="btn sec hide" id="btnFollowCh" style="padding:5px 10px;font-size:12px">Seguir</button>
          <button class="icon-btn" id="btnAudioCall" title="Ligação de Voz"></button>
          <button class="icon-btn" id="btnVideoCall" title="Ligação de Vídeo"></button>
          <button class="icon-btn" id="btnChatOpts" title="Opções da Conversa"></button>
        </div>
      </div>

      <div class="msgs" id="msgsBox"></div>

      <div id="drawer" class="drawer hide">
        <div class="drawer-head">
          <div class="tabs" style="width:230px">
            <button class="tab active" data-d="emoji">Emojis</button>
            <button class="tab" data-d="gif">GIFs</button>
            <button class="tab" data-d="sticker">Figurinhas</button>
          </div>
          <input id="drawerSearch" class="inp hide" style="padding:5px 9px;font-size:12px;max-width:160px" placeholder="Buscar GIF...">
          <button class="icon-btn" id="btnCloseDrawer"></button>
        </div>
        <div class="drawer-cats" id="drawerCats"></div>
        <div class="drawer-body" id="drawerBody"></div>
      </div>

      <div id="chReadOnly" class="hide" style="padding:12px;text-align:center;background:var(--panel);color:var(--mut);font-size:12px;border-top:1px solid var(--bdr)">Apenas o criador pode publicar neste canal de atualizações.</div>
      <div class="composer" id="composer">
        <button class="icon-btn" id="btnDrawer"></button>
        <input id="msgInp" placeholder="Digite uma mensagem...">
        <button class="icon-btn" id="btnSend" style="background:var(--acc);color:#fff"></button>
      </div>
    </div>
  </main>
</div>

<!-- MODAL GENÉRICO -->
<div id="modalBg" class="modal-bg hide">
  <div class="modal">
    <div class="modal-head"><span id="modalTitle"></span><button class="icon-btn" id="modalClose"></button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- CONTEXT MENU MENSAGEM -->
<div id="ctxMenu" class="ctx hide"></div>

<!-- CALL OVERLAY -->
<div id="callModal" class="hide">
  <div style="text-align:center">
    <div id="callPeer" style="font-size:20px;font-weight:700"></div>
    <div id="callStatus" style="font-size:13px;color:#94a3b8">Conectando...</div>
  </div>
  <div class="call-videos">
    <video id="remoteVid" autoplay playsinline></video>
    <video id="localVid" autoplay playsinline muted></video>
    <div id="audioPlaceholder" class="hide" style="display:flex;flex-direction:column;align-items:center;gap:10px;color:#94a3b8"></div>
  </div>
  <div class="call-ctrls">
    <button class="cbtn" id="cMute" title="Mutar Áudio"></button>
    <button class="cbtn hide" id="cBlur" title="Desfocar Câmera (Blur)"></button>
    <button class="cbtn on hide" id="cAccept" title="Atender"></button>
    <button class="cbtn end" id="cEnd" title="Encerrar"></button>
  </div>
</div>

/* ===== CRIPTOGRAFIA E2EE + CIFRA TOKI PONA NO RTDB ===== */
const TOKI = ['soweli','kijete','telo','seli','mun','kon','ilo','lape','musi','pona','wawa','laso','pipi','kala','waso','pan'];
const TOKI_MAP = Object.fromEntries(TOKI.map((w,i)=>[w,i]));
const toToki = bytes => Array.from(bytes, b => TOKI[b>>4]+' '+TOKI[b&15]).join(' ');
const fromToki = str => {
  const p = str.trim().split(/\s+/), out = new Uint8Array(p.length/2);
  for(let i=0;i<out.length;i++) out[i]=(TOKI_MAP[p[i*2]]<<4)|TOKI_MAP[p[i*2+1]];
  return out;
};
const sha256 = async t => {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
};
const deriveAesFromStr = async s => {
  const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ZC::'+s));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
};
const aesEnc = async (key, obj) => {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  const full = new Uint8Array(12 + ct.length); full.set(iv); full.set(ct, 12);
  return toToki(full);
};
const aesDec = async (key, tokiStr) => {
  if(!tokiStr || typeof tokiStr!=='string') return null;
  try{
    const full = fromToki(tokiStr), iv = full.slice(0,12), ct = full.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }catch{return null;}
};

async function getRoomKey(chatId){
  if(!S.roomKeys[chatId]) S.roomKeys[chatId] = await deriveAesFromStr('Room_'+chatId);
  return S.roomKeys[chatId];
}
async function getDmKey(peer){
  if(S.dmKeys[peer]) return S.dmKeys[peer];
  if(!S.pubCache[peer]){
    const snap = await get(ref(db,`users/${peer}/pub`));
    if(snap.exists()) S.pubCache[peer] = await crypto.subtle.importKey('jwk', snap.val(), {name:'ECDH',namedCurve:'P-256'}, true, []);
  }
  if(S.pubCache[peer] && S.myPriv){
    S.dmKeys[peer] = await crypto.subtle.deriveKey({name:'ECDH',public:S.pubCache[peer]}, S.myPriv, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
    return S.dmKeys[peer];
  }
  return getRoomKey(dmId(S.me, peer));
}

$('aSubmit').onclick = async () => {
  const nick = cleanNick($('aUser').value), pass = $('aPass').value;
  if(nick.length<3 || pass.length<3) return $('aMsg').textContent='Use nick e senha com 3+ caracteres (a-z, 0-9, _).';
  $('aMsg').textContent = 'Processando criptografia...';
  const passHash = await sha256(nick+':'+pass);
  const passKey = await deriveAesFromStr(nick+':'+pass);
  const uRef = ref(db, `users/${nick}`);
  const snap = await get(uRef);

  if(authMode==='reg'){
    if(snap.exists()) return $('aMsg').textContent='Esse username já existe!';
    const kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveKey']);
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
    const privJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const privEnc = await aesEnc(passKey, privJwk);
    const dirKey = await DIR_KEY_PROMISE;
    await set(uRef, { passHash, pub, privEnc, pubProf: await aesEnc(dirKey, S.profile) });
    await set(ref(db, `userMeta/${nick}`), await aesEnc(passKey, S.meta));
    localStorage.setItem('zc_sess', JSON.stringify({nick, pass}));
    await enterApp(nick, passKey, kp.privateKey);
  } else {
    if(!snap.exists()) return $('aMsg').textContent='Usuário não encontrado.';
    const u = snap.val();
    if(u.passHash !== passHash) return $('aMsg').textContent='Palavra-passe incorreta.';
    const privJwk = await aesDec(passKey, u.privEnc);
    if(!privJwk) return $('aMsg').textContent='Erro ao decifrar chave E2EE.';
    const privKey = await crypto.subtle.importKey('jwk', privJwk, {name:'ECDH',namedCurve:'P-256'}, true, ['deriveKey']);
    localStorage.setItem('zc_sess', JSON.stringify({nick, pass}));
    await enterApp(nick, passKey, privKey);
  }
};

async function enterApp(nick, passKey, privKey){
  S.me = nick; S.passKey = passKey; S.myPriv = privKey;
  $('authView').classList.add('hide'); $('app').classList.remove('hide');
  $('myNick').textContent = '@' + nick;
  const dirKey = await DIR_KEY_PROMISE;
  const uSnap = await get(ref(db, `users/${nick}`));
  if(uSnap.exists()){
    const prof = await aesDec(dirKey, uSnap.val().pubProf);
    if(prof) S.profile = {...S.profile, ...prof, priv:{...S.profile.priv, ...(prof.priv||{})}};
  }
  const mSnap = await get(ref(db, `userMeta/${nick}`));
  if(mSnap.exists()){
    const meta = await aesDec(passKey, mSnap.val());
    if(meta) S.meta = {...S.meta, ...meta};
  }
  applyTheme(); renderMyAv(); updateStatus(true);
  window.addEventListener('beforeunload', ()=>updateStatus(false));
  await syncAllChats();
  listenCalls();
  setInterval(runAutoClean24h, 60000);
}

async function syncAllChats(){
  updateCounts();
  const ids = [...S.meta.contacts.map(c=>dmId(S.me,c)), ...S.meta.groups, ...S.meta.followed, ...S.meta.channels];
  const unique = [...new Set(ids)];
  const dirKey = await DIR_KEY_PROMISE;
  for(const id of unique){
    const snap = await get(ref(db, `chats/${id}/meta`));
    if(snap.exists()){
      const m = snap.val();
      S.chats[id] = m;
      if(m.type==='dm'){
        const peer = Object.keys(m.members||{}).find(x=>x!==S.me) || id.replace('dm_','').replace(S.me,'').replace('__','');
        const ps = await get(ref(db, `users/${peer}/pubProf`));
        if(ps.exists()) S.chats[id].peerProf = await aesDec(dirKey, ps.val());
        S.chats[id].peerNick = peer;
      }
    }
  }
  renderChatList();
}

function renderChatList(){
  const q = $('searchInp').value.trim().toLowerCase();
  const box = $('chatList'); box.innerHTML = '';
  const list = Object.entries(S.chats).filter(([id,c])=>{
    if(S.filter==='dm' && c.type!=='dm') return false;
    if(S.filter==='group' && c.type!=='group') return false;
    if(S.filter==='channel' && c.type!=='channel') return false;
    const title = (c.type==='dm' ? '@'+c.peerNick : c.name).toLowerCase();
    return !q || title.includes(q);
  });
  if(!list.length) box.innerHTML = `<div style="padding:24px;text-align:center;color:var(--mut);font-size:13px">Nenhuma conversa. Clique em <b>+</b> acima para adicionar contato, criar grupo ou canal.</div>`;
  list.forEach(([id,c])=>{
    const isDm = c.type==='dm', peer = c.peerNick, pp = c.peerProf;
    const canShowPhoto = !isDm || canSee(pp?.priv?.photo, peer);
    const avUrl = isDm ? (canShowPhoto ? pp?.avatar : '') : c.avatar;
    const title = isDm ? '@'+peer : c.name;
    const div = document.createElement('div');
    div.className = 'chat-item' + (S.activeChat===id?' active':'');
    div.innerHTML = `<div class="av">${avUrl?`<img src="${avUrl}">`:(title.replace('@','')[0]||'?').toUpperCase()}</div>
      <div class="ci-mid"><div class="ci-top"><span class="ci-name">${esc(title)}</span><span class="badge">${c.type==='dm'?'DM':c.type==='group'?'Grupo':'Canal'}</span></div>
      <div class="ci-sub">${isDm?(canSee(pp?.priv?.bio,peer)?esc(pp?.bio||'ZeroChat'):'Privado'):(c.type==='channel'?'Canal de Atualizações':'Grupo')}</div></div>`;
    div.onclick = ()=>openChat(id);
    box.appendChild(div);
  });
}

async function openChat(id){
  S.activeChat = id;
  $('app').classList.add('chat-open');
  $('emptyMain').classList.add('hide');
  $('chatArea').classList.remove('hide');
  renderChatList();

  const c = S.chats[id], isDm = c.type==='dm', isCh = c.type==='channel';
  const peer = c.peerNick, pp = c.peerProf;
  const avUrl = isDm ? (canSee(pp?.priv?.photo,peer)?pp?.avatar:'') : c.avatar;
  $('peerAv').innerHTML = avUrl ? `<img src="${avUrl}">` : ((isDm?peer:c.name)[0]||'?').toUpperCase();
  $('peerName').textContent = isDm ? '@'+peer : c.name;

  $('btnAudioCall').classList.toggle('hide', !isDm);
  $('btnVideoCall').classList.toggle('hide', !isDm);
  $('btnFollowCh').classList.toggle('hide', !isCh || c.owner===S.me);
  const following = S.meta.followed.includes(id);
  $('btnFollowCh').textContent = following ? 'Seguindo' : 'Seguir';

  const canPost = !isCh || c.owner===S.me;
  $('composer').classList.toggle('hide', !canPost);
  $('chReadOnly').classList.toggle('hide', canPost);

  if(isDm && canSee(pp?.priv?.lastSeen, peer)){
    const st = (await get(ref(db,`status/${peer}`))).val();
    $('peerSub').textContent = st?.online ? 'Online agora' : (st?.last ? 'Visto '+new Date(st.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : 'Offline');
  } else {
    $('peerSub').textContent = isDm ? 'Criptografia E2EE' : (isCh ? `Canal por @${c.owner}` : `${Object.keys(c.members||{}).length} membros`);
  }

  if(S.msgUnsub) S.msgUnsub();
  const mRef = ref(db, `chats/${id}/msgs`);
  S.msgUnsub = onValue(mRef, async snap => {
    const val = snap.val() || {}, box = $('msgsBox');
    box.innerHTML = '';
    const key = isDm ? await getDmKey(peer) : await getRoomKey(id);
    const entries = Object.entries(val).sort((a,b)=>a[1].ts-b[1].ts);
    for(const [mid, m] of entries){
      if(m.delFor?.[S.me] || (S.profile.auto24h && Date.now()-m.ts > 86400000)) continue;
      if(S.meta.blocked.includes(m.from)) continue;
      const isOut = m.from === S.me;
      const div = document.createElement('div');
      let bodyHtml = '';
      if(m.delAll){
        bodyHtml = `<span style="font-style:italic;color:var(--mut);font-size:12px">Mensagem apagada</span>`;
      } else {
        const data = await aesDec(key, m.payload);
        if(!data) bodyHtml = `<span style="color:var(--mut);font-size:12px">[Cifra indisponível]</span>`;
        else if(data.t==='text') bodyHtml = `<span>${esc(data.v)}</span>`;
        else if(data.t==='gif') bodyHtml = `<img class="media" src="${esc(data.v)}">`;
        else if(data.t==='sticker'){ div.classList.add('sticker'); bodyHtml = `<img src="${esc(data.v)}">`; }
        else if(data.t==='pack'){
          bodyHtml = `<div class="pack-card">
            <div style="font-weight:700">${esc(data.pack.name)}</div>
            <div style="font-size:11px;color:var(--mut)">Autor: ${esc(data.pack.author)} • ${data.pack.items.length} figurinhas</div>
            <div class="pack-thumbs">${data.pack.items.slice(0,5).map(u=>`<img src="${esc(u)}">`).join('')}</div>
            <button class="btn" style="padding:6px;font-size:12px" data-import='${esc(JSON.stringify(data.pack))}'>Importar Pacote</button>
          </div>`;
        }
      }
      div.className += (div.classList.contains('sticker')?'':'msg ') + (isOut?'out':'in');
      if(div.classList.contains('sticker')) div.className = `msg sticker ${isOut?'out':'in'}`;
      const time = new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      div.innerHTML = `${(!isOut && !isDm)?`<div class="msg-sender">@${esc(m.from)}</div>`:''}${bodyHtml}
        <div class="msg-meta"><span>${time}</span>${isOut?ic(S.profile.priv.receipts?'dcheck':'check',13):''}</div>`;
      div.oncontextmenu = e => { e.preventDefault(); openMsgCtx(e, id, mid, isOut); };
      div.onclick = e => {
        if(e.target.dataset.import){
          const pk = JSON.parse(e.target.dataset.import);
          S.meta.packs.push(pk); pk.items.forEach(u=>{if(!S.meta.stickers.includes(u)) S.meta.stickers.push(u);});
          saveMeta(); alert('Pacote importado!');
        }
      };
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  });
}

async function runAutoClean24h(){

  }
}

/* ===== EMOJIS OFICIAIS POR CATEGORIA + KLIPY GIFS + FIGURINHAS/PACKS ===== */
const EMOJI_CATS = [
  ['Rostos',[[0x1F600,0x1F64F]]],
  ['Pessoas',[[0x1F440,0x1F487],[0x1F90C,0x1F93A]]],
  ['Animais',[[0x1F400,0x1F43F],[0x1F980,0x1F9AE]]],
  ['Comida',[[0x1F32D,0x1F37F],[0x1F950,0x1F96F]]],
  ['Atividades',[[0x1F3A0,0x1F3CC],[0x26BD,0x26BE]]],
  ['Viagens',[[0x1F680,0x1F6C5],[0x1F300,0x1F320]]],
  ['Objetos',[[0x1F4A0,0x1F4FF],[0x1F500,0x1F53D]]],
  ['Símbolos',[[0x2600,0x26FF],[0x2700,0x27BF],[0x1F1E6,0x1F1FF]]]
];
function buildEmojis(catIdx){
  const ranges = EMOJI_CATS[catIdx][1], out = [];
  if(catIdx===7){ // Bandeiras populares + simbolos
    const cc = ['BR','US','PT','JP','AR','FR','DE','ES','IT','GB','CA','MX','KR'];
    cc.forEach(c=>out.push(String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65,0x1F1E6+c.charCodeAt(1)-65)));
  }
  ranges.forEach(([a,b])=>{
    if(a===0x1F1E6) return;
    for(let cp=a;cp<=b;cp++){
      try{ const ch = String.fromCodePoint(cp); if(!/[\uFE00-\uFE0F]/.test(ch)) out.push(ch); }catch{}
    }
  });
  return out;
}

async function loadGifs(q){
  const body = $('drawerBody'); body.innerHTML = '<div style="color:var(--mut);font-size:12px">Carregando GIFs Klipy...</div>';
  try{
    const url = q
      ? `https://api.klipy.com/api/v1/${KLIPY_KEY}/gifs/search?page=1&per_page=24&q=${encodeURIComponent(q)}&customer_id=${S.me}&locale=BR`
      : `https://api.klipy.com/api/v1/${KLIPY_KEY}/gifs/trending?page=1&per_page=24&customer_id=${S.me}&locale=BR`;
    const r = await (await fetch(url)).json();
    const items = r?.data?.data || r?.data || [];
    body.innerHTML = '<div class="gif-grid"></div>';
    items.forEach(g=>{
      const src = g.file?.md?.gif?.url || g.file?.sm?.gif?.url || g.file?.hd?.gif?.url;
      if(!src) return;
      const d = document.createElement('div'); d.className='gif-item';
      d.innerHTML = `<img src="${src}" loading="lazy">`;
      d.onclick = () => sendMsg('gif', src);
      body.firstChild.appendChild(d);
    });
  }catch{ body.innerHTML='<div style="color:var(--danger);font-size:12px">Falha ao carregar Klipy GIFs.</div>'; }
}

const compressImg = (file, max=256) => new Promise(res=>{
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const sc = Math.min(max/img.width, max/img.height, 1);
      c.width = img.width*sc; c.height = img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/webp', 0.82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

/* ===== LIGAÇÕES DE VOZ & VÍDEO (WEBRTC + BLUR REAL NO VÍDEO) ===== */
const RTC_CFG = {iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
$('btnAudioCall').onclick = () => startCall('audio');
$('btnVideoCall').onclick = () => startCall('video');

async function startCall(mode){
  const peer = S.chats[S.activeChat]?.peerNick; if(!peer) return;
  await setupCallUI(peer, mode, false);
  const offer = await S.pc.createOffer();
  await S.pc.setLocalDescription(offer);
  await set(ref(db,`calls/${peer}`), {from:S.me, mode, offer:{type:offer.type,sdp:offer.sdp}, ts:Date.now()});
  onValue(ref(db,`calls/${peer}/answer`), async s => {
    if(s.exists() && S.pc && !S.pc.currentRemoteDescription){
      await S.pc.setRemoteDescription(new RTCSessionDescription(s.val()));
      $('callStatus').textContent = 'Em chamada';
    }
  });
}

function listenCalls(){
  onValue(ref(db,`calls/${S.me}`), async s => {
    const c = s.val(); if(!c || !c.offer || c.answered) return;
    $('callModal').classList.remove('hide');
    $('callPeer').textContent = '@'+c.from; $('callStatus').textContent = c.mode==='video'?'Chamada de Vídeo recebida...':'Chamada de Voz recebida...';
    $('cAccept').classList.remove('hide'); $('cBlur').classList.toggle('hide', c.mode!=='video');
    $('cAccept').onclick = async () => {
      $('cAccept').classList.add('hide');
      await setupCallUI(c.from, c.mode, true);
      await S.pc.setRemoteDescription(new RTCSessionDescription(c.offer));
      const ans = await S.pc.createAnswer();
      await S.pc.setLocalDescription(ans);
      await update(ref(db,`calls/${S.me}`), {answered:true, answer:{type:ans.type,sdp:ans.sdp}});
      $('callStatus').textContent = 'Em chamada';
    };
  });
}

async function setupCallUI(peer, mode, isCallee){
  $('callModal').classList.remove('hide');
  $('callPeer').textContent = '@'+peer; $('callStatus').textContent = isCallee?'Conectado':'Chamando...';
  $('cBlur').classList.toggle('hide', mode!=='video');
  $('localVid').classList.toggle('hide', mode!=='video');
  $('remoteVid').classList.toggle('hide', mode!=='video');
  $('audioPlaceholder').classList.toggle('hide', mode==='video');
  $('audioPlaceholder').innerHTML = ic('mic',48)+'<span>Ligação de Voz em andamento</span>';

  S.localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:mode==='video'});
  $('localVid').srcObject = S.localStream;
  S.pc = new RTCPeerConnection(RTC_CFG);
  S.localStream.getTracks().forEach(t=>S.pc.addTrack(t, S.localStream));
  S.pc.ontrack = e => { $('remoteVid').srcObject = e.streams[0]; };
  const sigTarget = isCallee ? S.me : peer;
  S.pc.onicecandidate = e => { if(e.candidate) push(ref(db,`calls/${sigTarget}/ice_${S.me}`), e.candidate.toJSON()); };
  onValue(ref(db,`calls/${sigTarget}/ice_${peer}`), s => {
    if(s.exists()) Object.values(s.val()).forEach(c=>S.pc?.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}));
  });
}

$('cMute').onclick = () => {
  S.muted = !S.muted; S.localStream?.getAudioTracks().forEach(t=>t.enabled=!S.muted);
  $('cMute').classList.toggle('on', S.muted);
};
$('cBlur').onclick = async () => {
  S.blurOn = !S.blurOn;
  $('cBlur').classList.toggle('on', S.blurOn);
  $('localVid').classList.toggle('blurred', S.blurOn);
  const sender = S.pc?.getSenders().find(s=>s.track?.kind==='video');
  if(!sender || !S.localStream) return;
  cancelAnimationFrame(S.blurRaf);
  if(S.blurOn){
    const vid = $('localVid'), cvs = document.createElement('canvas');
    cvs.width = 320; cvs.height = 240; const ctx = cvs.getContext('2d');
    const draw = () => { ctx.filter='blur(16px)'; ctx.drawImage(vid,0,0,320,240); S.blurRaf=requestAnimationFrame(draw); };
    draw();
    await sender.replaceTrack(cvs.captureStream(20).getVideoTracks()[0]);
  } else {
    await sender.replaceTrack(S.localStream.getVideoTracks()[0]);
  }
};
$('cEnd').onclick = async () => {
  cancelAnimationFrame(S.blurRaf); S.blurOn=false; S.muted=false;
  S.localStream?.getTracks().forEach(t=>t.stop()); S.pc?.close(); S.pc=null;
  $('callModal').classList.add('hide'); $('cAccept').classList.add('hide');
  await remove(ref(db,`calls/${S.me}`));
  if(S.activeChat && S.chats[S.activeChat]?.peerNick) await remove(ref(db,`calls/${S.chats[S.activeChat].peerNick}`));
};

/* AUTO-LOGIN */
const saved = localStorage.getItem('zc_sess');
if(saved){
  const {nick, pass} = JSON.parse(saved);
  $('aUser').value = nick; $('aPass').value = pass;
  $('aSubmit').click();
}
</script>
