<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZeroChat</title>
<style>
:root{--bg:#111215;--panel:#181a1e;--panel2:#21242a;--chat:#0c0d10;--in:#1e2026;--out:#31353e;--outTxt:#f4f4f5;--acc:#a1a1aa;--txt:#f4f4f5;--mut:#8b909a;--bdr:#2a2d35;--danger:#e11d48}
[data-theme="light"]{--bg:#f4f4f5;--panel:#ffffff;--panel2:#f1f2f4;--chat:#e7e8ec;--in:#ffffff;--out:#d4d4d8;--outTxt:#18181b;--acc:#52525b;--txt:#18181b;--mut:#71717a;--bdr:#e4e4e7}
[data-theme="oled"]{--bg:#000000;--panel:#08080a;--panel2:#111114;--chat:#000000;--in:#131317;--out:#27272a;--outTxt:#fafafa;--acc:#d4d4d8;--txt:#fafafa;--mut:#71717a;--bdr:#1e1e23}
[data-theme="pastel"]{--bg:#efede8;--panel:#faf8f5;--panel2:#f0ede6;--chat:#e5e1d8;--in:#ffffff;--out:#dce6df;--outTxt:#27272a;--acc:#7c8b82;--txt:#27272a;--mut:#6b7280;--bdr:#dfd9ce}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);height:100dvh;overflow:hidden;display:flex;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
.hide{display:none!important}
.icon-btn{width:35px;height:35px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);transition:.15s}
.icon-btn:hover{background:rgba(128,128,128,.16);color:var(--txt)}
.btn{background:var(--txt);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:hover{opacity:.9}.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:var(--panel2);border:1px solid var(--bdr);color:var(--txt)}.btn.red{background:var(--danger);color:#fff}
.inp{width:100%;background:var(--panel2);border:1px solid var(--bdr);border-radius:10px;padding:9px 12px;color:var(--txt)}
.inp:focus{border-color:var(--acc)}

/* AUTH MONOCHROME GLASS */
#authView{position:fixed;inset:0;background:#09090b;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.18;pointer-events:none;background:#e4e4e7}
.orb1{width:340px;height:340px;top:-90px;left:-60px}.orb2{width:300px;height:300px;bottom:-90px;right:-40px;background:#a1a1aa}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.auth-card{position:relative;width:100%;max-width:380px;background:rgba(20,21,24,.84);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:15px;box-shadow:0 28px 75px rgba(0,0,0,.7)}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.brand-badge{width:52px;height:52px;border-radius:15px;background:#f4f4f5;color:#09090b;display:flex;align-items:center;justify-content:center}
.auth-brand h1{font-size:23px;font-weight:800;letter-spacing:-.5px;color:#fafafa}
.tabs{display:flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:3px;gap:3px}
.tab{flex:1;padding:8px;border-radius:8px;font-weight:600;color:#8e929a;text-align:center}
.tab.active{background:#f4f4f5;color:#09090b}
.field{position:relative;display:flex;align-items:center}
.field .fi{position:absolute;left:12px;color:#71717a;display:flex;pointer-events:none}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px 36px 11px 38px;color:#fff}
.field input:focus{border-color:#d4d4d8}
.field .eye{position:absolute;right:10px;color:#71717a;display:flex}
#aMsg{font-size:12px;min-height:16px;text-align:center;color:#fb7185}

/* LAYOUT */
#app{display:flex;width:100%;height:100dvh;position:relative}
aside{width:355px;max-width:100%;background:var(--bg);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.top-bar{height:58px;background:var(--panel);padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);gap:8px}
.av{width:39px;height:39px;border-radius:12px;object-fit:cover;background:var(--panel2);border:1px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.search-box{padding:8px 12px;border-bottom:1px solid var(--bdr)}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 11px;border-radius:10px;border:1px solid var(--bdr)}
.nav-pills{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--bdr);overflow-x:auto}
.pill{padding:5px 10px;border-radius:16px;background:var(--panel);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--bdr)}
.pill.active{background:var(--txt);color:var(--bg);border-color:transparent}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid rgba(128,128,128,.08);cursor:pointer}
.chat-item:hover,.chat-item.active{background:var(--panel)}
.ci-mid{flex:1;min-width:0}.ci-top{display:flex;justify-content:space-between;margin-bottom:2px;gap:6px;align-items:center}
.ci-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ci-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;background:var(--panel2);border:1px solid var(--bdr);color:var(--mut);padding:1px 6px;border-radius:7px;font-weight:600}

/* MAIN CHAT + WALLPAPER */
main{flex:1;display:flex;flex-direction:column;background:var(--chat);position:relative;min-width:0;background-size:cover;background-position:center}
.chat-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);pointer-events:none;z-index:0}
#chatArea,#emptyMain{position:relative;z-index:1}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;padding:24px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 11px 6px;border-radius:14px;position:relative;word-break:break-word;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.15);user-select:none}
.msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
.msg.out{align-self:flex-end;background:var(--out);color:var(--outTxt);border-top-right-radius:3px}
.msg-sender{font-size:11px;font-weight:700;opacity:.8}
.msg-quote{background:rgba(0,0,0,.16);border-left:3px solid var(--acc);padding:4px 8px;border-radius:6px;font-size:11px;opacity:.9}
.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;opacity:.68}
.msg img.media{max-width:230px;max-height:240px;border-radius:10px;object-fit:contain}
.msg.sticker{background:transparent!important;box-shadow:none;padding:2px}
.msg.sticker img{width:130px;height:130px;object-fit:contain}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.react-pill{background:var(--panel2);color:var(--txt);border:1px solid var(--bdr);border-radius:12px;padding:1px 7px;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.react-pill.me{border-color:var(--txt)}
.poll-box{min-width:210px;display:flex;flex-direction:column;gap:6px}
.poll-opt{background:rgba(128,128,128,.15);border:1px solid var(--bdr);border-radius:8px;padding:6px 9px;text-align:left;position:relative;overflow:hidden;font-size:13px}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(128,128,128,.25);z-index:0}
.poll-opt span{position:relative;z-index:1;display:flex;justify-content:space-between}
.pack-card{background:var(--panel2);color:var(--txt);border:1px solid var(--bdr);border-radius:12px;padding:10px;min-width:210px;display:flex;flex-direction:column;gap:6px}
.pack-thumbs{display:flex;gap:4px;overflow-x:auto}.pack-thumbs img{width:44px;height:44px;object-fit:contain;background:rgba(0,0,0,.1);border-radius:6px}
.reply-bar{background:var(--panel);border-top:1px solid var(--bdr);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.composer{background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--bdr);position:relative}
.composer input{flex:1;background:var(--panel2);border-radius:12px;padding:9px 13px;border:1px solid var(--bdr)}
.plus-menu{position:absolute;bottom:62px;left:12px;background:var(--panel);border:1px solid var(--bdr);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:40;min-width:200px}
.plus-menu button{padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:13px;text-align:left}
.plus-menu button:hover{background:var(--panel2)}

/* DRAWER & MODALS & STATUS */
.drawer{height:300px;background:var(--panel);border-top:1px solid var(--bdr);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--bdr);gap:8px}
.drawer-cats{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--bdr);overflow-x:auto}
.drawer-body{flex:1;overflow-y:auto;padding:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px}
.emoji-btn{height:34px;font-size:20px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.emoji-btn:hover{background:rgba(128,128,128,.18)}
.gif-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gif-item{height:95px;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel2)}
.gif-item img{width:100%;height:100%;object-fit:cover}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.stk-item{background:var(--panel2);border:1px solid var(--bdr);border-radius:10px;padding:5px;position:relative;display:flex;align-items:center;justify-content:center;height:74px;cursor:pointer}
.stk-item img{max-width:100%;max-height:100%;object-fit:contain}
.stk-fav{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#f59e0b;display:flex;align-items:center;justify-content:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:450px;max-height:88dvh;background:var(--panel);border:1px solid var(--bdr);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;font-weight:700}
.modal-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.banner-box{position:relative;margin-bottom:32px}
.banner-img{width:100%;height:110px;border-radius:12px;object-fit:cover;background:var(--panel2);border:1px solid var(--bdr);display:block}
.banner-av{position:absolute;left:14px;bottom:-28px;width:68px;height:68px;border:4px solid var(--panel);border-radius:16px;background:var(--panel2);overflow:hidden}
.banner-av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.1)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;display:block}
.ctx{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--bdr);border-radius:12px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.45);min-width:190px}
.ctx-reacts{display:flex;gap:4px;padding:4px 4px 6px;border-bottom:1px solid var(--bdr);margin-bottom:4px;align-items:center}
.ctx-reacts button{width:28px;height:28px;font-size:17px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.ctx-act{width:100%;text-align:left;padding:7px 9px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:8px}
.ctx-act:hover{background:var(--panel2)}
.st-frame{background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;margin:0 auto}
.st-frame.r16{aspect-ratio:16/9}.st-frame.r9{aspect-ratio:9/16;max-height:56dvh;width:auto}
.st-frame img{width:100%;height:100%;object-fit:cover}
#callModal{position:fixed;inset:0;background:#09090b;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 16px;color:#fff}
.call-videos{position:relative;width:100%;max-width:680px;flex:1;display:flex;align-items:center;justify-content:center;margin:14px 0;background:#111114;border:1px solid #27272a;border-radius:18px;overflow:hidden}
#remoteVid{width:100%;height:100%;object-fit:cover}
#localVid{position:absolute;right:12px;bottom:12px;width:120px;height:160px;object-fit:cover;border-radius:12px;border:2px solid #f4f4f5;background:#000}
.blurred{filter:blur(16px)}
.call-ctrls{display:flex;gap:16px}
.cbtn{width:52px;height:52px;border-radius:50%;background:#27272a;color:#fff;display:flex;align-items:center;justify-content:center}
.cbtn.on{background:#f4f4f5;color:#09090b}.cbtn.end{background:var(--danger)}
#backBtn{display:none}
@media(max-width:768px){aside{width:100%}#app.chat-open aside{display:none}#app:not(.chat-open) main{display:none}#backBtn{display:inline-flex}}
</style>
</head>
<body data-theme="dark">

<!-- AUTH -->
<div id="authView">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="grid-bg"></div>
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-badge" id="authLogo"></div><h1>ZeroChat</h1></div>
    <div class="tabs"><button class="tab active" data-auth="login">Entrar</button><button class="tab" data-auth="reg">Criar Conta</button></div>
    <div class="field"><span class="fi" id="icAuthUser"></span><input id="aUser" placeholder="Username fixo (nick)" autocomplete="username"></div>
    <div class="field"><span class="fi" id="icAuthPass"></span><input id="aPass" type="password" placeholder="Palavra-passe" autocomplete="current-password"><button type="button" class="eye" id="togglePass"></button></div>
    <div id="aMsg"></div>
    <button id="aSubmit" class="btn" style="padding:11px;background:#f4f4f5;color:#09090b">Entrar no ZeroChat</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#71717a"><span id="authLock"></span> E2EE + Cifra Toki Pona no RTDB</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <aside>
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer" id="btnMyProfile">
        <div class="av" id="myAv"></div>
        <div><div id="myNick" style="font-weight:700"></div><div style="font-size:11px;color:var(--mut)">Online</div></div>
      </div>
      <div style="display:flex;gap:1px">
        <button class="icon-btn" id="btnStatus" title="Status (16:9 / 9:16)"></button>
        <button class="icon-btn" id="btnNewChat" title="Novo / Descobrir Canais"></button>
        <button class="icon-btn" id="btnThemeQuick" title="Alternar Tema"></button>
        <button class="icon-btn" id="btnSettings" title="Configurações"></button>
      </div>
    </div>
    <div class="search-box"><div class="search-wrap"><span id="icSearch"></span><input id="searchInp" placeholder="Buscar conversa ou canal..."></div></div>
    <div class="nav-pills" id="navPills">
      <button class="pill active" data-f="all">Tudo</button>
      <button class="pill" data-f="dm">Contatos (<span id="cntDm">0</span>/45)</button>
      <button class="pill" data-f="group">Grupos (<span id="cntGrp">0</span>/7)</button>
      <button class="pill" data-f="channel">Canais (<span id="cntCh">0</span>/3)</button>
      <button class="pill" id="btnDiscoverPill">Descobrir</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main id="mainPane">
    <div id="chatOverlay" class="chat-overlay hide"></div>
    <div id="emptyMain" class="empty-state">
      <div id="emptyLogo"></div><h2>ZeroChat</h2>
      <p style="max-width:320px;font-size:13px">Conversas privadas com E2EE, cifra Toki Pona no banco, enquetes em canais, formatação e status.</p>
    </div>
    <div id="chatArea" class="hide" style="display:flex;flex-direction:column;height:100%">
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button class="icon-btn" id="backBtn"></button>
          <div class="av" id="peerAv" style="cursor:pointer"></div>
          <div style="min-width:0;cursor:pointer" id="peerInfoBtn">
            <div id="peerName" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
            <div id="peerSub" style="font-size:11px;color:var(--mut)"></div>
          </div>
        </div>
        <div style="display:flex;gap:2px;align-items:center">
          <button class="btn sec hide" id="btnFollowCh" style="padding:5px 10px;font-size:12px">Seguir</button>
          <button class="icon-btn" id="btnAudioCall" title="Ligação de Voz"></button>
          <button class="icon-btn" id="btnVideoCall" title="Ligação de Vídeo"></button>
          <button class="icon-btn" id="btnChatOpts" title="Opções"></button>
        </div>
      </div>

      <div class="msgs" id="msgsBox"></div>
      <div id="replyBar" class="reply-bar hide">
        <span id="replyPreview" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
        <button class="icon-btn" id="replyCancel" style="width:24px;height:24px"></button>
      </div>

      <div id="drawer" class="drawer hide">
        <div class="drawer-head">
          <div class="tabs" style="width:230px;background:var(--panel2)">
            <button class="tab active" data-d="emoji">Emojis</button><button class="tab" data-d="gif">GIFs</button><button class="tab" data-d="sticker">Figurinhas</button>
          </div>
          <input id="drawerSearch" class="inp hide" style="padding:5px 9px;font-size:12px;max-width:150px" placeholder="Buscar GIF...">
          <button class="icon-btn" id="btnCloseDrawer"></button>
        </div>
        <div class="drawer-cats" id="drawerCats"></div>
        <div class="drawer-body" id="drawerBody"></div>
      </div>

      <div id="chReadOnly" class="hide" style="padding:11px;text-align:center;background:var(--panel);color:var(--mut);font-size:12px;border-top:1px solid var(--bdr)"></div>
      <div class="composer" id="composer">
        <div id="plusMenu" class="plus-menu hide"></div>
        <button class="icon-btn" id="btnAppsPlus" title="Upload, Enquete e Formatação"></button>
        <button class="icon-btn" id="btnDrawer" title="Emojis, GIFs e Figurinhas"></button>
        <input id="msgInp" placeholder="Mensagem... (**negrito** --riscado-- __sub__ # título)">
        <button class="icon-btn" id="btnSend" style="background:var(--txt);color:var(--bg)"></button>
      </div>
    </div>
  </main>
</div>

<div id="modalBg" class="modal-bg hide"><div class="modal"><div class="modal-head"><span id="modalTitle"></span><button class="icon-btn" id="modalClose"></button></div><div class="modal-body" id="modalBody"></div></div></div>
<div id="ctxMenu" class="ctx hide"></div>
<div id="callModal" class="hide">
  <div style="text-align:center"><div id="callPeer" style="font-size:20px;font-weight:700"></div><div id="callStatus" style="font-size:13px;color:#a1a1aa">Conectando...</div></div>
  <div class="call-videos"><video id="remoteVid" autoplay playsinline></video><video id="localVid" autoplay playsinline muted></video><div id="audioPlaceholder" class="hide" style="display:flex;flex-direction:column;align-items:center;gap:10px;color:#a1a1aa"></div></div>
  <div class="call-ctrls"><button class="cbtn" id="cMute"></button><button class="cbtn hide" id="cBlur"></button><button class="cbtn on hide" id="cAccept"></button><button class="cbtn end" id="cEnd"></button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

/* ===== CRIPTOGRAFIA E2EE + TOKI PONA ===== */
const HAS_SUBTLE = !!(window.crypto && window.crypto.subtle);
const TOKI = ['soweli','kijete','telo','seli','mun','kon','ilo','lape','musi','pona','wawa','laso','pipi','kala','waso','pan'];
const TOKI_MAP = Object.fromEntries(TOKI.map((w,i)=>[w,i]));
const toToki = b => Array.from(b, x => TOKI[x>>4]+' '+TOKI[x&15]).join(' ');
const fromToki = s => { const p=s.trim().split(/\s+/), o=new Uint8Array(p.length/2); for(let i=0;i<o.length;i++) o[i]=(TOKI_MAP[p[i*2]]<<4)|TOKI_MAP[p[i*2+1]]; return o; };
function hashStr32(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const sha256 = async t => HAS_SUBTLE ? Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))).map(x=>x.toString(16).padStart(2,'0')).join('') : hashStr32('A'+t)+hashStr32('B'+t)+hashStr32('C'+t)+hashStr32('D'+t);
const deriveAesFromStr = async s => HAS_SUBTLE ? crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ZC::'+s)), 'AES-GCM', false, ['encrypt','decrypt']) : {fallbackSeed:s};
const aesEnc = async (key, obj) => {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(HAS_SUBTLE && !key?.fallbackSeed){
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, raw));
    const full = new Uint8Array(12+ct.length); full.set(iv); full.set(ct,12); return toToki(full);
  }
  const seed = hashStr32(key?.fallbackSeed||'ZC'), out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw[i]^seed.charCodeAt(i%seed.length)^((i*31)&255);
  return toToki(out);
};
const aesDec = async (key, tokiStr) => {
  if(!tokiStr || typeof tokiStr!=='string') return null;
  try{
    const full = fromToki(tokiStr);
    if(HAS_SUBTLE && !key?.fallbackSeed){
      const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:full.slice(0,12)}, key, full.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    }
    const seed = hashStr32(key?.fallbackSeed||'ZC'), out = new Uint8Array(full.length);
    for(let i=0;i<full.length;i++) out[i] = full[i]^seed.charCodeAt(i%seed.length)^((i*31)&255);
    return JSON.parse(new TextDecoder().decode(out));
  }catch{return null;}
};
const withTimeout = (p, ms=12000) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo limite ao conectar ao Firebase.')), ms))]);

async function getDmKey(peer){
  if(S.dmKeys[peer]) return S.dmKeys[peer];
  if(HAS_SUBTLE && S.myPriv && !S.pubCache[peer]){
    const snap = await get(ref(db,`users/${peer}/pub`));
    if(snap.exists()) S.pubCache[peer] = await crypto.subtle.importKey('jwk', snap.val(), {name:'ECDH',namedCurve:'P-256'}, true, []);
  }
  if(HAS_SUBTLE && S.pubCache[peer] && S.myPriv)
    return (S.dmKeys[peer] = await crypto.subtle.deriveKey({name:'ECDH',public:S.pubCache[peer]}, S.myPriv, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']));
  return getRoomKey(dmId(S.me, peer));
}

$('aSubmit').onclick = async () => {
  const nick = cleanNick($('aUser').value), pass = $('aPass').value;
  if(nick.length<3 || pass.length<3) return $('aMsg').textContent='Use nick e senha com 3+ caracteres (a-z, 0-9, _).';
  const btn = $('aSubmit'); btn.disabled = true; $('aMsg').style.color='#d4d4d8'; $('aMsg').textContent='Processando criptografia...';
  try{
    const banSnap = await withTimeout(get(ref(db,`bannedUsers/${nick}`)));
    if(banSnap.exists()) throw new Error('Conta banida: ' + (banSnap.val().reason || 'Violação dos termos.'));
    const passHash = await sha256(nick+':'+pass), passKey = await deriveAesFromStr(nick+':'+pass);
    const uRef = ref(db, `users/${nick}`), snap = await withTimeout(get(uRef));
    if(authMode==='reg'){
      if(snap.exists()) throw new Error('Esse username já existe!');
      let pub = null, privKey = null, privEnc = '';
      if(HAS_SUBTLE){
        const kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveKey']);
        pub = await crypto.subtle.exportKey('jwk', kp.publicKey); privKey = kp.privateKey;
        privEnc = await aesEnc(passKey, await crypto.subtle.exportKey('jwk', kp.privateKey));
      }
      await withTimeout(set(uRef, {passHash, pub, privEnc, pubProf:await aesEnc(await getDirKey(), S.profile)}));
      await withTimeout(set(ref(db,`userMeta/${nick}`), await aesEnc(passKey, S.meta)));
      localStorage.setItem('zc_sess', JSON.stringify({nick, pass})); await enterApp(nick, passKey, privKey);
    } else {
      if(!snap.exists()) throw new Error('Usuário não encontrado.');
      const u = snap.val(); if(u.passHash !== passHash) throw new Error('Palavra-passe incorreta.');
      let privKey = null;
      if(HAS_SUBTLE && u.privEnc){
        const jwk = await aesDec(passKey, u.privEnc); if(!jwk) throw new Error('Erro ao decifrar chave E2EE.');
        privKey = await crypto.subtle.importKey('jwk', jwk, {name:'ECDH',namedCurve:'P-256'}, true, ['deriveKey']);
      }
      localStorage.setItem('zc_sess', JSON.stringify({nick, pass})); await enterApp(nick, passKey, privKey);
    }
  } catch(err){ $('aMsg').style.color='#fb7185'; $('aMsg').textContent = err?.message || 'Erro ao autenticar.'; }
  finally{ btn.disabled = false; }
};

async function enterApp(nick, passKey, privKey){
  S.me = nick; S.passKey = passKey; S.myPriv = privKey;
  $('authView').classList.add('hide'); $('app').classList.remove('hide'); $('myNick').textContent = '@'+nick;
  onValue(ref(db,`bannedUsers/${nick}`), s => { if(s.exists()){ alert('Você foi banido do ZeroChat.'); localStorage.removeItem('zc_sess'); location.reload(); }});

  const dirKey = await getDirKey();
  const uSnap = await get(ref(db,`users/${nick}`));
  if(uSnap.exists()){ const p = await aesDec(dirKey, uSnap.val().pubProf); if(p) S.profile = {...S.profile, ...p, priv:{...S.profile.priv,...(p.priv||{})}}; }
  const mSnap = await get(ref(db,`userMeta/${nick}`));
  if(mSnap.exists()){ const m = await aesDec(passKey, mSnap.val()); if(m) S.meta = {...S.meta, ...m}; }
  if(!S.meta.pinned) S.meta.pinned = ['sys_zerochat'];
  if(!S.meta.pinned.includes('sys_zerochat')) S.meta.pinned.unshift('sys_zerochat');

  // Garante conversa oficial fixada ZeroChat
  const zRef = ref(db,'chats/sys_zerochat/meta');
  if(!(await get(zRef)).exists()) await set(zRef, {type:'channel', name:'ZeroChat', owner:'ZeroChat_Admin', official:true, createdAt:Date.now()});

  applyTheme(); renderMyAv(); updateStatus(true);
  window.addEventListener('beforeunload', ()=>updateStatus(false));
  await syncAllChats(); listenCalls(); setInterval(runAutoClean24h, 60000);
}

async function syncAllChats(){
  updateCounts(); S.chats = {};
  const ids = ['sys_zerochat', ...S.meta.contacts.map(c=>dmId(S.me,c)), ...S.meta.groups, ...S.meta.followed, ...S.meta.channels];
  const dirKey = await getDirKey();
  for(const id of [...new Set(ids)]){
    const snap = await get(ref(db,`chats/${id}/meta`));
    if(!snap.exists()) continue;
    const m = snap.val();
    if(m.type==='group' && m.banned?.[S.me]) continue;
    S.chats[id] = m;
    if(m.type==='dm'){
      const peer = Object.keys(m.members||{}).find(x=>x!==S.me) || id.replace('dm_','').replace(S.me,'').replace('__','');
      const ps = await get(ref(db,`users/${peer}/pubProf`));
      if(ps.exists()) S.chats[id].peerProf = await aesDec(dirKey, ps.val());
      S.chats[id].peerNick = peer;
    }
  }
  renderChatList();
}

function renderChatList(){
  const q = $('searchInp').value.trim().toLowerCase(), box = $('chatList'); box.innerHTML = '';
  const list = Object.entries(S.chats).filter(([,c])=>{
    if(S.filter==='dm' && c.type!=='dm') return false;
    if(S.filter==='group' && c.type!=='group') return false;
    if(S.filter==='channel' && c.type!=='channel') return false;
    const title = (c.type==='dm' ? '@'+c.peerNick : c.name).toLowerCase();
    return !q || title.includes(q);
  }).sort(([a],[b])=>{
    if(a==='sys_zerochat') return -1; if(b==='sys_zerochat') return 1;
    const pa = S.meta.pinned.includes(a)?1:0, pb = S.meta.pinned.includes(b)?1:0;
    return pb - pa;
  });
  list.forEach(([id,c])=>{
    const isDm = c.type==='dm', peer = c.peerNick, pp = c.peerProf, isPin = S.meta.pinned.includes(id);
    const avUrl = isDm ? (canSee(pp?.priv?.photo,peer)?pp?.avatar:'') : c.avatar;
    const title = isDm ? '@'+peer : c.name;
    const div = document.createElement('div'); div.className = 'chat-item' + (S.activeChat===id?' active':'');
    div.innerHTML = `<div class="av">${id==='sys_zerochat'?ic('logo',20):(avUrl?`<img src="${avUrl}">`:(title.replace('@','')[0]||'?').toUpperCase())}</div>
      <div class="ci-mid"><div class="ci-top"><span class="ci-name">${esc(title)}${c.official?` <span title="Oficial">${ic('verified',13)}</span>`:''}${isPin?` <span style="opacity:.6">${ic('pin',12)}</span>`:''}</span>
      <span class="badge">${c.official?'Oficial':c.type==='dm'?'DM':c.type==='group'?'Grupo':'Canal'}</span></div>
      <div class="ci-sub">${c.official?'Atualizações do sistema':isDm?(canSee(pp?.priv?.bio,peer)?esc(pp?.bio||'ZeroChat'):'Privado'):(c.type==='channel'?'Canal':'Grupo')}</div></div>`;
    div.onclick = ()=>openChat(id);
    box.appendChild(div);
  });
}

async function openChat(id){
  S.activeChat = id; S.replyTo = null; $('replyBar').classList.add('hide');
  $('app').classList.add('chat-open'); $('emptyMain').classList.add('hide'); $('chatArea').classList.remove('hide'); renderChatList();
  const c = S.chats[id], isDm = c.type==='dm', isCh = c.type==='channel', isGrp = c.type==='group';
  const peer = c.peerNick, pp = c.peerProf;
  const avUrl = isDm ? (canSee(pp?.priv?.photo,peer)?pp?.avatar:'') : c.avatar;
  $('peerAv').innerHTML = id==='sys_zerochat' ? ic('logo',20) : (avUrl ? `<img src="${avUrl}">` : ((isDm?peer:c.name)[0]||'?').toUpperCase());
  $('peerName').textContent = isDm ? '@'+peer : c.name;

  $('btnAudioCall').classList.toggle('hide', !isDm); $('btnVideoCall').classList.toggle('hide', !isDm);
  $('btnFollowCh').classList.toggle('hide', !isCh || c.owner===S.me || id==='sys_zerochat');
  $('btnFollowCh').textContent = S.meta.followed.includes(id) ? 'Seguindo' : 'Seguir';

  const mutedInGrp = isGrp && c.muted?.[S.me], closedGrp = isGrp && c.closed && c.owner!==S.me;
  const canPost = (!isCh || c.owner===S.me) && !mutedInGrp && !closedGrp;
  $('composer').classList.toggle('hide', !canPost);
  $('chReadOnly').classList.toggle('hide', canPost);
  $('chReadOnly').textContent = isCh ? 'Apenas o dono do canal pode publicar. Você pode visualizar e votar em enquetes.' : (closedGrp?'Grupo fechado pelo administrador.':'Você foi mutado neste grupo.');

  if(isDm && canSee(pp?.priv?.lastSeen, peer)){
    const st = (await get(ref(db,`status/${peer}`))).val();
    $('peerSub').textContent = st?.online ? 'Online agora' : (st?.last ? 'Visto '+new Date(st.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : 'Offline');
  } else $('peerSub').textContent = c.official ? 'Canal Oficial ZeroChat' : isDm ? 'Criptografia E2EE' : (isCh ? `Canal por @${c.owner}` : `${Object.keys(c.members||{}).length} membros`);

  if(S.pollUnsub) S.pollUnsub();
  S.pollUnsub = onValue(ref(db,`chats/${id}/pollVotes`), s => { S.pollVotes = s.val()||{}; renderChatMsgs(id); });
  if(S.msgUnsub) S.msgUnsub();
  S.msgUnsub = onValue(ref(db,`chats/${id}/msgs`), s => { S.curMsgs = s.val()||{}; renderChatMsgs(id); });
}

async function renderChatMsgs(id){
  if(S.activeChat !== id) return;
  const c = S.chats[id], isDm = c.type==='dm', peer = c.peerNick, box = $('msgsBox');
  box.innerHTML = '';
  const key = isDm ? await getDmKey(peer) : await getRoomKey(id);
  for(const [mid, m] of Object.entries(S.curMsgs||{}).sort((a,b)=>a[1].ts-b[1].ts)){
    if(m.delFor?.[S.me] || (S.profile.auto24h && Date.now()-m.ts>86400000) || S.meta.blocked.includes(m.from)) continue;
    const isOut = m.from === S.me, div = document.createElement('div');
    let bodyHtml = '', previewTxt = '[Mídia]';
    if(m.delAll){ bodyHtml = `<span style="font-style:italic;opacity:.7;font-size:12px">Mensagem apagada</span>`; }
    else if(id==='sys_zerochat' && m.plainText){ previewTxt = m.plainText; bodyHtml = `<span>${fmtText(m.plainText)}</span>`; }
    else {
      const data = await aesDec(key, m.payload);
      if(!data) bodyHtml = `<span style="opacity:.7;font-size:12px">[Cifra indisponível]</span>`;
      else if(data.t==='text'){ previewTxt = data.v; bodyHtml = `<span>${fmtText(data.v)}</span>`; }
      else if(data.t==='img'){ bodyHtml = `<img class="media" src="${esc(data.v)}">`; }
      else if(data.t==='gif'){ bodyHtml = `<img class="media" src="${esc(data.v)}">`; }
      else if(data.t==='sticker'){ div.classList.add('sticker'); bodyHtml = `<img src="${esc(data.v)}">`; }
      else if(data.t==='poll'){
        previewTxt = 'Enquete: '+data.q;
        const votes = S.pollVotes[mid]||{}, total = Object.keys(votes).length;
        bodyHtml = `<div class="poll-box"><div style="font-weight:700">${esc(data.q)}</div>` + data.opts.map((opt,oi)=>{
          const cnt = Object.values(votes).filter(v=>v===oi).length, pct = total?Math.round(cnt*100/total):0;
          return `<button class="poll-opt" data-poll="${mid}" data-opt="${oi}"><div class="poll-bar" style="width:${pct}%"></div><span><b>${esc(opt)}</b><em>${cnt} (${pct}%)</em></span></button>`;
        }).join('') + `<div style="font-size:11px;opacity:.7">${total} voto(s)</div></div>`;
      } else if(data.t==='pack'){
        bodyHtml = `<div class="pack-card"><div style="font-weight:700">${esc(data.pack.name)}</div>
          <div style="font-size:11px;color:var(--mut)">Autor: ${esc(data.pack.author)} • ${data.pack.items.length} figurinhas</div>
          <div class="pack-thumbs">${data.pack.items.slice(0,5).map(u=>`<img src="${esc(u)}">`).join('')}</div>
          <button class="btn" style="padding:6px;font-size:12px" data-import='${esc(JSON.stringify(data.pack))}'>Importar Pacote</button></div>`;
      }
    }
    const reactsHtml = m.reacts ? `<div class="reacts">${Object.entries(m.reacts).map(([em,users])=>{
      const uList = Object.keys(users||{}).filter(u=>users[u]); if(!uList.length) return '';
      return `<button class="react-pill ${users[S.me]?'me':''}" data-rmid="${mid}" data-rem="${em}">${em} ${uList.length}</button>`;
    }).join('')}</div>` : '';
    const quoteHtml = m.replyTo ? `<div class="msg-quote"><b>@${esc(m.replyTo.from)}</b>: ${esc(m.replyTo.preview.slice(0,60))}</div>` : '';
    div.className = (div.classList.contains('sticker')?'msg sticker ':'msg ') + (isOut?'out':'in');
    const time = new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    div.innerHTML = `${(!isOut && !isDm)?`<div class="msg-sender">@${esc(m.from)}</div>`:''}${quoteHtml}${bodyHtml}${reactsHtml}
      <div class="msg-meta"><span>${time}</span>${isOut?ic(S.profile.priv.receipts?'dcheck':'check',13):''}</div>`;

    let holdT;
    div.ontouchstart = e => { holdT = setTimeout(()=>openMsgCtx(e.touches[0], id, mid, m.from, previewTxt, isOut), 420); };
    div.ontouchend = div.ontouchmove = () => clearTimeout(holdT);
    div.oncontextmenu = e => { e.preventDefault(); openMsgCtx(e, id, mid, m.from, previewTxt, isOut); };
    div.onclick = async e => {
      if(e.target.closest('[data-poll]')){
        const b = e.target.closest('[data-poll]');
        await set(ref(db,`chats/${id}/pollVotes/${b.dataset.poll}/${S.me}`), Number(b.dataset.opt));
      } else if(e.target.closest('[data-rem]')){
        const b = e.target.closest('[data-rem]'); toggleReact(id, b.dataset.rmid, b.dataset.rem);
      } else if(e.target.dataset.import){
        const pk = JSON.parse(e.target.dataset.import);
        S.meta.packs.push(pk); pk.items.forEach(u=>{if(!S.meta.stickers.includes(u)) S.meta.stickers.push(u);});
        saveMeta(); alert('Pacote importado!');
      }
    };
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(t, v, extra={}){
  if(!S.activeChat) return;
  const id = S.activeChat, c = S.chats[id];
  if(c.type==='dm' && S.meta.blocked.includes(c.peerNick)) return alert('Usuário bloqueado.');
  const key = c.type==='dm' ? await getDmKey(c.peerNick) : await getRoomKey(id);
  const payload = await aesEnc(key, {t, v, ...extra});
  const msgObj = { from:S.me, ts:Date.now(), payload };
  if(S.replyTo) msgObj.replyTo = S.replyTo;
  S.replyTo = null; $('replyBar').classList.add('hide');
  await push(ref(db,`chats/${id}/msgs`), msgObj);
}

  m.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{ toggleReact(chatId,mid,b.dataset.qr); m.classList.add('hide'); });

const EMOJI_CATS = [['Rostos',[[0x1F600,0x1F64F]]],['Pessoas',[[0x1F440,0x1F487],[0x1F90C,0x1F93A]]],['Animais',[[0x1F400,0x1F43F],[0x1F980,0x1F9AE]]],['Comida',[[0x1F32D,0x1F37F],[0x1F950,0x1F96F]]],['Atividades',[[0x1F3A0,0x1F3CC],[0x26BD,0x26BE]]],['Viagens',[[0x1F680,0x1F6C5],[0x1F300,0x1F320]]],['Objetos',[[0x1F4A0,0x1F4FF],[0x1F500,0x1F53D]]],['Símbolos',[[0x2600,0x26FF],[0x2700,0x27BF]]]];

        d.querySelectorAll('[data-rm]').forEach(rb=>rb.onclick=()=>{ const [pi,si]=rb.dataset.rm.split(':'); S.meta.packs[pi].items.splice(si,1); saveMeta(); $('stPacks').click(); });
        body.appendChild(d);

    $('stNew').onclick=openCreateStickerModal; $('stNewPack').onclick=openCreatePackModal;
  }

async function loadGifs(q){

const compressImg = (file, max=256) => new Promise(res=>{ const r=new FileReader(); r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(max/img.width,max/img.height,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/webp',0.82));};img.src=r.result;};r.readAsDataURL(file); });

function openNewChatModal(startTab='dm'){
  openModal('Novo / Descobrir Canais', `
  <div class="tabs" style="background:var(--panel2)"><button class="tab" data-nc="dm">Contato</button><button class="tab" data-nc="grp">Grupo</button>
    <button class="tab" data-nc="ch">Criar Canal</button><button class="tab" data-nc="dir">Descobrir Canais</button></div>
  <div id="ncBody"></div>`, ()=>{
  const renderNc = mode => {
    document.querySelectorAll('[data-nc]').forEach(x=>x.classList.toggle('active',x.dataset.nc===mode));
    const b = $('ncBody');
    if(mode==='dm'){
      b.innerHTML=`<input id="ncNick" class="inp" placeholder="Nick (${S.meta.contacts.length}/45)"><button class="btn" style="margin-top:8px;width:100%" id="ncGo">Adicionar</button>`;
      $('ncGo').onclick=async()=>{
        if(S.meta.contacts.length>=45) return alert('Limite de 45 contatos!');
        const peer=cleanNick($('ncNick').value); if(!peer||peer===S.me) return alert('Nick inválido.');
        if(!(await get(ref(db,`users/${peer}`))).exists()) return alert('Usuário não existe.');
        if(!S.meta.contacts.includes(peer)) S.meta.contacts.push(peer);
        const id=dmId(S.me,peer); await set(ref(db,`chats/${id}/meta`),{type:'dm',members:{[S.me]:true,[peer]:true},createdAt:Date.now()});
        await saveMeta(); await syncAllChats(); $('modalBg').classList.add('hide'); openChat(id);
      };
    } else if(mode==='grp'){
      b.innerHTML=`<input id="gName" class="inp" placeholder="Nome do grupo (${S.meta.groups.length}/7)"><input id="gMems" class="inp" style="margin-top:8px" placeholder="Membros (ex: joao, ana)"><button class="btn" style="margin-top:8px;width:100%" id="gGo">Criar Grupo</button>`;
      $('gGo').onclick=async()=>{
        if(S.meta.groups.length>=7) return alert('Limite de 7 grupos!');
        const name=$('gName').value.trim(); if(!name) return;
        const mems={[S.me]:true}; $('gMems').value.split(',').map(cleanNick).filter(Boolean).forEach(m=>mems[m]=true);
        const id='grp_'+Date.now(); await set(ref(db,`chats/${id}/meta`),{type:'group',name,owner:S.me,members:mems,closed:false,muted:{},banned:{},createdAt:Date.now()});
        S.meta.groups.push(id); await saveMeta(); await syncAllChats(); $('modalBg').classList.add('hide'); openChat(id);
      };
    } else if(mode==='ch'){
      b.innerHTML=`<input id="cName" class="inp" placeholder="Nome do canal (${S.meta.channels.length}/3)"><button class="btn" style="margin-top:8px;width:100%" id="cGo">Criar Canal</button>`;
      $('cGo').onclick=async()=>{
        if(S.meta.channels.length>=3) return alert('Limite de 3 canais!');
        const name=$('cName').value.trim(); if(!name) return;
        const id='ch_'+Date.now(); await set(ref(db,`chats/${id}/meta`),{type:'channel',name,owner:S.me,createdAt:Date.now()});
        await set(ref(db,`channelsDir/${id}`),{name,owner:S.me});
        S.meta.channels.push(id); await saveMeta(); await syncAllChats(); $('modalBg').classList.add('hide'); openChat(id);
      };
    } else {
      b.innerHTML='<input id="dirQ" class="inp" placeholder="Filtrar canais..."><div id="dirList" style="margin-top:8px"></div>';
      get(ref(db,'channelsDir')).then(s=>{
        const d=s.val()||{};
        const draw=()=>{
          const q=$('dirQ').value.trim().toLowerCase(); $('dirList').innerHTML='';
          const entries=Object.entries(d).filter(([,info])=>!q||info.name.toLowerCase().includes(q)||info.owner.toLowerCase().includes(q));
          if(!entries.length) return $('dirList').innerHTML='<div style="font-size:12px;color:var(--mut)">Nenhum canal encontrado.</div>';
          entries.forEach(([cid,info])=>{
            const fol=S.meta.followed.includes(cid)||S.meta.channels.includes(cid), row=document.createElement('div'); row.className='row';
            row.innerHTML=`<div><b>${esc(info.name)}</b><div style="font-size:11px;color:var(--mut)">Dono: @${esc(info.owner)}</div></div>
              <button class="btn ${fol?'sec':''}" style="padding:5px 10px;font-size:12px">${fol?'Abrir':'Seguir'}</button>`;
            row.querySelector('button').onclick=async()=>{
              if(!S.meta.followed.includes(cid)&&!S.meta.channels.includes(cid)){S.meta.followed.push(cid);await saveMeta();}
              await syncAllChats(); $('modalBg').classList.add('hide'); openChat(cid);
            }; $('dirList').appendChild(row);
          });
        };
        draw(); $('dirQ').oninput=draw;
      });
    }
  };
  renderNc(startTab);
  document.querySelectorAll('[data-nc]').forEach(t=>t.onclick=()=>renderNc(t.dataset.nc));
  });
}

async function runAutoClean24h(){
  if(!S.profile.auto24h || !S.activeChat) return;
  const s=await get(ref(db,`chats/${S.activeChat}/msgs`)); if(!s.exists()) return;
  const now=Date.now(); for(const [mid,m] of Object.entries(s.val())) if(now-m.ts>86400000) await remove(ref(db,`chats/${S.activeChat}/msgs/${mid}`));
}

async function startCall(mode){
  const peer=S.chats[S.activeChat]?.peerNick; if(!peer) return;
  await setupCallUI(peer,mode,false); const offer=await S.pc.createOffer(); await S.pc.setLocalDescription(offer);
  await set(ref(db,`calls/${peer}`),{from:S.me,mode,offer:{type:offer.type,sdp:offer.sdp},ts:Date.now()});
  onValue(ref(db,`calls/${peer}/answer`),async s=>{if(s.exists()&&S.pc&&!S.pc.currentRemoteDescription){await S.pc.setRemoteDescription(new RTCSessionDescription(s.val()));$('callStatus').textContent='Em chamada';}});
}
function listenCalls(){
  onValue(ref(db,`calls/${S.me}`),async s=>{
    const c=s.val(); if(!c||!c.offer||c.answered) return;
    $('callModal').classList.remove('hide'); $('callPeer').textContent='@'+c.from; $('callStatus').textContent=c.mode==='video'?'Chamada de Vídeo...':'Chamada de Voz...';
    $('cAccept').classList.remove('hide'); $('cBlur').classList.toggle('hide',c.mode!=='video');
    $('cAccept').onclick=async()=>{$('cAccept').classList.add('hide');await setupCallUI(c.from,c.mode,true);await S.pc.setRemoteDescription(new RTCSessionDescription(c.offer));const ans=await S.pc.createAnswer();await S.pc.setLocalDescription(ans);await update(ref(db,`calls/${S.me}`),{answered:true,answer:{type:ans.type,sdp:ans.sdp}});$('callStatus').textContent='Em chamada';};
  });
}
async function setupCallUI(peer,mode,isCallee){
  $('callModal').classList.remove('hide'); $('callPeer').textContent='@'+peer; $('callStatus').textContent=isCallee?'Conectado':'Chamando...';
  $('cBlur').classList.toggle('hide',mode!=='video'); $('localVid').classList.toggle('hide',mode!=='video'); $('remoteVid').classList.toggle('hide',mode!=='video');
  $('audioPlaceholder').classList.toggle('hide',mode==='video'); $('audioPlaceholder').innerHTML=ic('mic',48)+'<span>Ligação de Voz</span>';
  S.localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'}); $('localVid').srcObject=S.localStream;
  S.pc=new RTCPeerConnection(RTC_CFG); S.localStream.getTracks().forEach(t=>S.pc.addTrack(t,S.localStream));
  S.pc.ontrack=e=>{$('remoteVid').srcObject=e.streams[0];};
  const sigTarget=isCallee?S.me:peer;
  S.pc.onicecandidate=e=>{if(e.candidate)push(ref(db,`calls/${sigTarget}/ice_${S.me}`),e.candidate.toJSON());};
  onValue(ref(db,`calls/${sigTarget}/ice_${peer}`),s=>{if(s.exists())Object.values(s.val()).forEach(c=>S.pc?.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}));});
}
$('cMute').onclick=()=>{S.muted=!S.muted;S.localStream?.getAudioTracks().forEach(t=>t.enabled=!S.muted);$('cMute').classList.toggle('on',S.muted);};
$('cBlur').onclick=async()=>{
  S.blurOn=!S.blurOn;$('cBlur').classList.toggle('on',S.blurOn);$('localVid').classList.toggle('blurred',S.blurOn);
  const sender=S.pc?.getSenders().find(s=>s.track?.kind==='video'); if(!sender||!S.localStream)return;
  cancelAnimationFrame(S.blurRaf);
  if(S.blurOn){const v=$('localVid'),c=document.createElement('canvas');c.width=320;c.height=240;const x=c.getContext('2d');const d=()=>{x.filter='blur(16px)';x.drawImage(v,0,0,320,240);S.blurRaf=requestAnimationFrame(d);};d();await sender.replaceTrack(c.captureStream(20).getVideoTracks()[0]);}
  else await sender.replaceTrack(S.localStream.getVideoTracks()[0]);
};
$('cEnd').onclick=async()=>{cancelAnimationFrame(S.blurRaf);S.blurOn=false;S.muted=false;S.localStream?.getTracks().forEach(t=>t.stop());S.pc?.close();S.pc=null;$('callModal').classList.add('hide');$('cAccept').classList.add('hide');await remove(ref(db,`calls/${S.me}`));if(S.activeChat&&S.chats[S.activeChat]?.peerNick)await remove(ref(db,`calls/${S.chats[S.activeChat].peerNick}`));};

const saved = localStorage.getItem('zc_sess');
if(saved){ try{ const {nick, pass} = JSON.parse(saved); $('aUser').value=nick; $('aPass').value=pass; $('aSubmit').click(); }catch{} }
</script>
